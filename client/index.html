<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSpend — FinTech & Personal Wealth Platform</title>

    <!-- Immediate Theme Injection to Prevent White Flash (FOUC) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('smartspend_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || !stored) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      html.dark {
        color-scheme: dark;
        background-color: #020617;
      }
      html:not(.dark) {
        color-scheme: light;
        background-color: #f8fafc;
      }
      #app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s ease;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      html.dark #app-preloader {
        background-color: #020617;
        color: #f8fafc;
      }
      html:not(.dark) #app-preloader {
        background-color: #f8fafc;
        color: #0f172a;
      }
      @keyframes ss-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen">
    <div id="root">
      <!-- Instant Pre-hydration Shell to Completely Eliminate White / Blank Flash -->
      <div id="app-preloader">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #0f766e); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4); margin-bottom: 16px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
        </div>
        <div style="font-weight: 700; font-size: 19px; letter-spacing: -0.02em; margin-bottom: 6px;">
          SmartSpend
        </div>
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">
          Personal Wealth Ledger
        </div>
        <div style="width: 22px; height: 22px; border: 2.5px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: ss-spin 0.7s linear infinite;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
