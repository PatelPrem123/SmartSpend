              "acceptedAnswer": {
                "@type": "Answer",
                "text": "SmartSpend stores every transaction, balance, and budget strictly in 64-bit integer minor currency units (paise for INR, where ₹1.00 = 100 paise). This permanently prevents IEEE 754 floating-point rounding drift common in JavaScript software."
